<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Loja Independente</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 0; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; min-height: 100vh; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding-bottom: 40px; }
        
        /* ESTILO DA VITRINE DO CLIENTE */
        .store-banner { width: 100%; height: 180px; object-fit: cover; background: #ddd; }
        .store-header { text-align: center; padding: 0 20px; margin-top: -50px; }
        .store-logo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.2); background: #fff; }
        .store-name { font-size: 24px; font-weight: bold; margin: 10px 0 5px; color: #2c3e50; }
        .whatsapp-btn { display: inline-block; background: #25d366; color: white; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; margin: 10px 0 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* PAINEL ADMINISTRATIVO */
        .admin-padding { padding: 20px; }
        h1, h2 { color: #2c3e50; }
        .box { background: #f9f9f9; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        input, button, textarea { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #2980b9; }
        .btn-alt { background: #2ecc71; }
        .btn-alt:hover { background: #27ae60; }
        
        .product-card { background: #fff; border: 1px solid #e1e1e1; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .carousel { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 10px; padding-bottom: 5px; }
        .carousel img { width: 100px; height: 100px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
        video { width: 100%; max-height: 200px; background: #000; border-radius: 6px; margin-top: 10px; }
        .hidden { display: none; }
        .alert { color: #e74c3c; font-weight: bold; font-size: 14px; }
        .success { color: #27ae60; font-weight: bold; font-size: 14px; }
        .toggle-link { text-align: center; margin-top: 15px; cursor: pointer; color: #3498db; text-decoration: underline; font-weight: bold; }
        .buy-btn { background: #25d366; margin-top: 15px; font-size: 16px; text-align: center; display: block; text-decoration: none; color: white; padding: 12px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- MODO CLIENTE: VITRINE DA LOJA -->
        <div id="client-store-view" class="hidden">
            <img id="client-banner" class="store-banner" src="" alt="Banner da Loja">
            <div class="store-header">
                <img id="client-logo" class="store-logo" src="" alt="Logo">
                <h1 id="client-store-name" class="store-name">Carregando...</h1>
                <div id="client-whatsapp-container"></div>
            </div>
            <div class="admin-padding">
                <h2>Produtos Disponíveis</h2>
                <div id="client-products-list">Carregando produtos...</div>
            </div>
        </div>

        <!-- MODO LOJISTA: PAINEL DE CONTROLE E CUSTOMIZAÇÃO -->
        <div id="admin-container" class="admin-padding">
            <h1>Painel da Sua Loja</h1>
            <p>Personalize sua vitrine e cadastre seus produtos.</p>

            <div id="auth-section" class="box">
                <h2 id="auth-title">Acessar Meu Painel</h2>
                
                <div id="register-fields" class="hidden">
                    <label>Nome da Loja:</label>
                    <input type="text" id="store-name-input" placeholder="Ex: Boutique Bella">
                    
                    <label>Seu WhatsApp (com DDD):</label>
                    <input type="text" id="store-whatsapp-input" placeholder="Ex: 11999999999">

                    <label>Logo da Loja (Escolha da Galeria):</label>
                    <input type="file" id="store-logo-file" accept="image/*">

                    <label>Banner de Capa (Escolha da Galeria):</label>
                    <input type="file" id="store-banner-file" accept="image/*">
                </div>

                <label>Chave Secreta (Senha):</label>
                <input type="password" id="token-input" placeholder="Sua senha secreta de acesso">
                
                <button id="auth-btn" onclick="handleAuth()">Entrar no Painel</button>
                <p id="auth-error" class="alert"></p>

                <div class="toggle-link" id="toggle-mode-btn" onclick="toggleMode()">Não tem uma loja? Criar agora</div>
            </div>

            <div id="dashboard-section" class="hidden">
                <div class="box" style="background: #e8f8f5; border-color: #a3e4d7;">
                    <h2 id="welcome-store-title">Painel</h2>
                    <p><strong>Link exclusivo da sua loja (envie para os clientes):</strong></p>
                    <input type="text" id="share-link-output" readonly style="background: #fff; font-weight: bold; color: #2980b9;">
                    
                    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #a3e4d7;">
                    
                    <label>Cadastrar Produto via Link:</label>
                    <input type="text" id="product-link-input" placeholder="Cole o link do produto aqui">
                    <button onclick="importProduct()">Adicionar à Minha Vitrine</button>
                    <p id="import-status"></p>
                </div>

                <h2>Produtos na Sua Vitrine</h2>
                <div id="admin-products-list">Carregando...</div>
            </div>
        </div>

    </div>

    <script>
        const API_URL = 'https://minhalojacat-logo.onrender.com';
        let isRegistering = false;
        let currentStore = null;

        const urlParams = new URLSearchParams(window.location.search);
        const storeSlug = urlParams.get('loja');

        if (storeSlug) {
            document.getElementById('admin-container').classList.add('hidden');
            document.getElementById('client-store-view').classList.remove('hidden');
            loadClientStore(storeSlug);
        }

        // Função para converter imagem da galeria em Base64 para envio fácil
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function loadClientStore(slug) {
            try {
                const res = await fetch(`${API_URL}/api/public/store/${slug}`);
                const data = await res.json();
                
                if (data.error) {
                    document.getElementById('client-store-name').innerText = "Loja não encontrada";
                    document.getElementById('client-products-list').innerHTML = `<p class="alert">${data.error}</p>`;
                    return;
                }
                
                const store = data.store;
                document.getElementById('client-store-name').innerText = store.store_name;
                document.title = `${store.store_name} - Vitrine Exclusiva`;
                
                if (store.banner) document.getElementById('client-banner').src = store.banner;
                if (store.logo) document.getElementById('client-logo').src = store.logo;

                if (store.whatsapp) {
                    let cleanPhone = store.whatsapp.replace(/\D/g, '');
                    document.getElementById('client-whatsapp-container').innerHTML = `
                        <a class="whatsapp-btn" href="https://wa.me/55${cleanPhone}?text=Olá!%20Vim%20pela%20sua%20vitrine%20e%20gostaria%20de%20comprar." target="_blank">
                            💬 Falar no WhatsApp da Loja
                        </a>
                    `;
                }

                const listContainer = document.getElementById('client-products-list');
                if (data.products.length === 0) {
                    listContainer.innerHTML = "<p>Esta loja ainda não possui produtos cadastrados.</p>";
                    return;
                }

                let html = '';
                data.products.forEach(p => {
                    let imagesHtml = (p.images || []).map(img => `<img src="${img}" alt="Foto">`).join('');
                    let wppContact = store.whatsapp ? `https://wa.me/55${store.whatsapp.replace(/\D/g, '')}?text=Olá!%20Tenho%20interesse%20no%20produto:%20${encodeURIComponent(p.title)}` : p.source_link;
                    
                    html += `
                        <div class="product-card">
                            <h3>${p.title}</h3>
                            <p style="font-size: 18px; color: #27ae60; font-weight: bold;">R$ ${Number(p.price || 0).toFixed(2)}</p>
                            <p>${p.description}</p>
                            <div class="carousel">${imagesHtml}</div>
                            ${p.video_url ? `<video controls src="${p.video_url}"></video>` : ''}
                            <a href="${wppContact}" target="_blank" class="buy-btn">Comprar via WhatsApp</a>
                        </div>
                    `;
                });
                listContainer.innerHTML = html;
            } catch (err) {
                document.getElementById('client-store-name').innerText = "Erro de conexão";
                document.getElementById('client-products-list').innerHTML = `<p class="alert">Não foi possível carregar a vitrine.</p>`;
            }
        }

        function toggleMode() {
            isRegistering = !isRegistering;
            const errorElem = document.getElementById('auth-error');
            errorElem.innerText = '';
            
            if (isRegistering) {
                document.getElementById('auth-title').innerText = "Criar Minha Loja Personalizada";
                document.getElementById('register-fields').classList.remove('hidden');
                document.getElementById('auth-btn').innerText = "Cadastrar Loja";
                document.getElementById('auth-btn').className = "btn-alt";
                document.getElementById('toggle-mode-btn').innerText = "Já tem uma loja? Entrar";
            } else {
                document.getElementById('auth-title').innerText = "Acessar Meu Painel";
                document.getElementById('register-fields').classList.add('hidden');
                document.getElementById('auth-btn').innerText = "Entrar no Painel";
                document.getElementById('auth-btn').className = "";
                document.getElementById('toggle-mode-btn').innerText = "Não tem uma loja? Criar agora";
            }
        }

        async function handleAuth() {
            const token = document.getElementById('token-input').value.trim();
            const errorElem = document.getElementById('auth-error');
            errorElem.innerText = '';
            
            if (!token) {
                errorElem.innerText = "Digite a chave secreta.";
                return;
            }

            if (isRegistering) {
                const store_name = document.getElementById('store-name-input').value.trim();
                const whatsapp = document.getElementById('store-whatsapp-input').value.trim();
                const logoFile = document.getElementById('store-logo-file').files[0];
                const bannerFile = document.getElementById('store-banner-file').files[0];

                if (!store_name) {
                    errorElem.innerText = "Digite o nome da loja.";
                    return;
                }

                errorElem.innerText = "Processando imagens e criando loja...";

                let logoBase64 = "";
                let bannerBase64 = "";

                if (logoFile) logoBase64 = await fileToBase64(logoFile);
                if (bannerFile) bannerBase64 = await fileToBase64(bannerFile);

                try {
                    const res = await fetch(`${API_URL}/api/register-store`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ store_name, store_token: token, whatsapp, logo: logoBase64, banner: bannerBase64 })
                    });
                    const data = await res.json();
                    if (data.success) {
                        loginSuccess(data.store, token);
                    } else {
                        errorElem.innerText = data.error || "Erro ao cadastrar loja.";
                    }
                } catch (e) {
                    errorElem.innerText = "Erro de conexão com o servidor.";
                }
            } else {
                errorElem.innerText = "Verificando acesso...";
                try {
                    const res = await fetch(`${API_URL}/api/verify-token`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token })
                    });
                    const data = await res.json();
                    if (data.success) {
                        loginSuccess(data.store, token);
                    } else {
                        errorElem.innerText = data.error || "Chave secreta não encontrada.";
                    }
                } catch (e) {
                    errorElem.innerText = "Erro de conexão.";
                }
            }
        }

        function loginSuccess(store, token) {
            currentStore = { ...store, token };
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('welcome-store-title').innerText = `Painel: ${store.store_name}`;
            
            const shareUrl = `${API_URL}/?loja=${store.store_slug}`;
            document.getElementById('share-link-output').value = shareUrl;

            loadAdminProducts(store.id, token);
        }

        async function importProduct() {
            const product_link = document.getElementById('product-link-input').value.trim();
            const statusElem = document.getElementById('import-status');
            
            if (!product_link) {
                statusElem.className = "alert";
                statusElem.innerText = "Cole o link do produto.";
                return;
            }

            statusElem.className = "";
            statusElem.innerText = "Importando produto para a vitrine...";

            try {
                const res = await fetch(`${API_URL}/api/import-product`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-store-token': currentStore.token
                    },
                    body: JSON.stringify({ product_link })
                });
                const data = await res.json();
                if (data.success) {
                    statusElem.className = "success";
                    statusElem.innerText = "✅ " + data.message;
                    document.getElementById('product-link-input').value = '';
                    loadAdminProducts(currentStore.id, currentStore.token);
                } else {
                    statusElem.className = "alert";
                    statusElem.innerText = "❌ " + (data.error || "Erro ao importar.");
                }
            } catch (err) {
                statusElem.className = "alert";
                statusElem.innerText = "❌ Erro de conexão.";
            }
        }

        async function loadAdminProducts(storeId, token) {
            try {
                const res = await fetch(`${API_URL}/api/store/${storeId}/products`, {
                    headers: { 'x-store-token': token }
                });
                const products = await res.json();
                const listContainer = document.getElementById('admin-products-list');
                
                if (!Array.isArray(products) || products.length === 0) {
                    listContainer.innerHTML = "<p>Nenhum produto cadastrado na vitrine ainda.</p>";
                    return;
                }
                
                let html = '';
                products.forEach(p => {
                    let imagesHtml = (p.images || []).map(img => `<img src="${img}" alt="Foto">`).join('');
                    html += `
                        <div class="product-card">
                            <h3>${p.title}</h3>
                            <p><strong>Preço:</strong> R$ ${Number(p.price || 0).toFixed(2)}</p>
                            <p>${p.description}</p>
                            <div class="carousel">${imagesHtml}</div>
                            ${p.video_url ? `<video controls src="${p.video_url}"></video>` : ''}
                        </div>
                    `;
                });
                listContainer.innerHTML = html;
            } catch (err) {
                document.getElementById('admin-products-list').innerHTML = "<p class='alert'>Erro ao carregar produtos.</p>";
            }
        }
    </script>
</body>
</html>
